name: associate_llm
base_llm_config: base_default_llm
type: llm_config
description_for_human: "LLM config for tactical tasks (Associate Agents). Uses Claude Sonnet 4."

config:
  model: "anthropic/claude-sonnet-4-20250514"
  api_key:
    _type: "from_env"
    var: "ANTHROPIC_API_KEY"
    required: true
  temperature:
    _type: "from_env"
    var: "AGENT_TEMPERATURE"
    default: 0.4
    required: false
  # Limit output tokens to prevent context overflow (input + max_tokens must be < 200K)
  # Associates produce tool calls and summaries, not long documents - 16K is ample
  max_tokens: 16384
  max_retries: 2
  wait_seconds_on_retry: 3
