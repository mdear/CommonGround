name: fast_utils_llm
base_llm_config: base_default_llm
type: llm_config
description_for_human: "LLM config for fast, low-cost utility tasks like naming or simple formatting. Uses Claude 3.5 Haiku."

config:
  model: "anthropic/claude-3-5-haiku-20241022"
  api_key:
    _type: "from_env"
    var: "ANTHROPIC_API_KEY"
    required: true
  temperature:
    _type: "from_env"
    var: "FAST_UTILS_TEMPERATURE"
    default: 0.1
    required: false
  max_retries: 1
  wait_seconds_on_retry: 1
